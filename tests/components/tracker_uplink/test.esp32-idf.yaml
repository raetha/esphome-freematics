# ESPHome-style component test: every option and automation of tracker_uplink
# (each protocol: Traccar's two and Home Assistant's webhook, side by side),
# compiled for an ESP32 with ESP-IDF. CI builds it alongside the examples.
esphome:
  name: test-traccar-uplink

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

wifi:
  ssid: MySSID
  password: password1

external_components:
  - source:
      type: local
      path: ../../../components
    components: [trip_tracker, tracker_uplink]

trip_tracker:
  id: trips

tracker_uplink:
  - id: traccar
    host: traccar.example.com
    port: 5027
    device_id: test-device
    send_interval: 30s
    ack_timeout: 10s
    max_queue: 100
    batch_max: 20
    moving_interval: 5s
    turn_angle: 45
    min_turn_interval: 2s
    heartbeat_interval: 30min
    altitude: false

  - id: traccar_text
    protocol: freematics
    host: traccar.example.com
    device_id: test-device

  # Home Assistant's webhook, beside Traccar
  - id: ha_uplink
    trip_tracker_id: trips
    protocol: home_assistant
    url: https://hooks.nabu.casa/test-webhook-id
    send_interval: 2min
    batch_max: 60

interval:
  - interval: 2s
    then:
      - tracker_uplink.flush: traccar
      - lambda: |-
          ESP_LOGD("test", "queued %u, sent %" PRIu32 " records in %" PRIu32 " bytes", (unsigned) id(traccar).queued(),
                   id(ha_uplink).records_sent(), id(ha_uplink).bytes_sent());
