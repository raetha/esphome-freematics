# ESPHome-style component test: every option of file_logger, writing to an SD
# card. CI builds it alongside the examples.
esphome:
  name: test-file-logger

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

external_components:
  - source:
      type: local
      path: ../../../components
    components: [sd_card, file_logger]

wifi:
  ssid: MySSID
  password: password1

# The download's HTTP server (ESPHome's bare one, without the web dashboard)
web_server_base:
  id: http_server

spi:
  id: sd_bus
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

sd_card:
  spi_id: sd_bus
  cs_pin: GPIO5

file_logger:
  path: /sdcard/test.log
  level: INFO
  max_size: 64kB
  buffer_size: 2048
  flush_interval: 5s
  http:
    web_server_base_id: http_server
    username: logs
    password: a-long-password
