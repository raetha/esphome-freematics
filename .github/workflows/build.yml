name: Build

# Branches (docs/development.md -> "Branches and releases"): work lands on `dev`, and each
# release is one squash-merged pull request from `dev` into `main`.
# Every push and pull request: changelog and Markdown checks, ruff, the script and workflow
# tests, and `esphome config` + `esphome compile` of the example device config.
# Push to main: if the board package's version has no tag yet (and there's no DRAFT file), tag
# it and publish the GitHub release with the changelog section as notes, delete the test
# builds, then reset `dev` to `main` when everything on it was released.
# Push to dev: when something that ships changed (packages/, components/), publish a test build
# as a GitHub pre-release tagged `<version>-dev.<n>`, which a device config can pin as its
# package `ref`; older test builds are deleted.

# Manual only for now, to save Actions minutes while the repository is private:
# run it from the Actions tab (or `gh api -X POST .../actions/workflows/build.yml/dispatches`)
# on a branch when a change needs compiling. When the repository goes public, restore:
#   push: { branches: [main, dev] }
#   pull_request:
on:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to exact commits (version in the comment); Dependabot
# (.github/dependabot.yml) proposes updates weekly.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Changelog and lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # On dev the version is the expected next one, undated until the release pull request;
      # into and on main it must have its dated section. Released sections must match main's.
      # The repository is private and checkouts drop their credentials, so main's changelog
      # comes through the API with the job's read-only token rather than `git fetch`.
      - name: Check the changelog
        env:
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/contents/CHANGELOG.md?ref=main" -H "Accept: application/vnd.github.raw" \
            > "$RUNNER_TEMP/main-changelog.md" 2>/dev/null || cp CHANGELOG.md "$RUNNER_TEMP/main-changelog.md"
          if [ "$BASE_REF" = main ] || [ "$GITHUB_REF" = refs/heads/main ]; then
            python3 scripts/release.py check --release --released-from "$RUNNER_TEMP/main-changelog.md"
          else
            python3 scripts/release.py check --released-from "$RUNNER_TEMP/main-changelog.md"
          fi

      # One line per paragraph or list item, so renderers wrap them (scripts/markdown.py).
      - name: Check Markdown line breaks
        run: python3 scripts/markdown.py --check $(git ls-files '*.md')

      - name: Install ruff (the version pinned in requirements-dev.txt)
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"

      - name: ruff check
        run: ruff check scripts/ tests/

      - name: ruff format check
        run: ruff format --check scripts/ tests/

  tests:
    name: Script and workflow tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install "$(grep -E '^pytest==' requirements-dev.txt)" "$(grep -E '^pyyaml==' requirements-dev.txt)"

      - name: pytest
        run: pytest tests/ -v --tb=short

  esphome:
    name: ESPHome config and compile
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ESPHome (the version pinned in requirements-dev.txt)
        run: pip install "$(grep -E '^esphome==' requirements-dev.txt)"

      # The ESP-IDF framework and toolchain (~1 GB) are downloaded once per ESPHome version.
      - name: Cache the ESP-IDF toolchain and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/esphome
            examples/.esphome
          key: esphome-${{ hashFiles('requirements-dev.txt') }}-${{ hashFiles('packages/**', 'components/**', 'examples/*.yaml') }}
          restore-keys: |
            esphome-${{ hashFiles('requirements-dev.txt') }}-

      - name: Placeholder secrets
        run: cp examples/secrets.example.yaml examples/secrets.yaml

      - name: esphome config
        run: |
          for f in examples/*.yaml; do
            case "$f" in */secrets*) continue ;; esac
            esphome config "$f" > /dev/null
            echo "$f: valid"
          done

      - name: esphome compile
        run: esphome compile examples/car.yaml

  release:
    needs: [lint, tests, esphome]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish the release if this version has no tag yet
        run: |
          set -e
          if [ -f DRAFT ]; then
            echo "DRAFT: no release until the owner says the first one is ready"
            exit 0
          fi
          version=$(python3 scripts/release.py version)
          if gh api "repos/$GH_REPO/git/ref/tags/$version" >/dev/null 2>&1 ||
             gh api "repos/$GH_REPO/git/ref/tags/v$version" >/dev/null 2>&1; then
            echo "$version is already released: nothing to release"
            exit 0
          fi
          python3 scripts/release.py notes "$version" > notes.md
          gh release create "$version" --target "$GITHUB_SHA" --title "ESPHome Freematics $version" \
            --notes-file notes.md
          echo "Released $version"

      - name: Delete test builds
        run: |
          set -e
          gh release list --limit 100 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName' |
            { grep -E '^v?[0-9.]+-dev\.[0-9]+$' || true; } | while read -r old; do
              gh release delete "$old" --yes --cleanup-tag
            done

  sync-dev:
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Reset dev when everything on it reached main: the same files, or dev is an ancestor of
      # the pull request just merged (a release branch dates the changelog on top of dev).
      - name: Reset dev to main if it was released
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          git rev-parse -q --verify origin/dev >/dev/null || { echo "no dev branch"; exit 0; }
          released=false
          if git diff --quiet origin/main origin/dev; then
            released=true
          else
            pr=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA/pulls" --jq '.[0].number // ""' || true)
            if [ -n "$pr" ]; then
              git fetch --quiet origin "refs/pull/$pr/head"
              if git merge-base --is-ancestor origin/dev FETCH_HEAD; then released=true; fi
            fi
          fi
          if [ "$released" = true ]; then
            git push --force origin origin/main:refs/heads/dev
            echo "dev reset to main"
          else
            echo "::warning::dev has changes that aren't on main: left as it is"
          fi

  test-build:
    needs: [lint, tests, esphome]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A push that changes nothing a device config pulls in (docs, tests, CI) publishes no test
      # build. Run the workflow by hand on dev to publish one anyway.
      - name: Check whether anything that ships changed
        id: ships
        run: |
          set -e
          ships='^(packages/|components/)'
          last=$(gh api "repos/$GH_REPO/releases?per_page=100" \
            --jq '[.[] | select(.prerelease) | .tag_name | select(test("^v?[0-9.]+-dev\\.[0-9]+$"))][0] // ""')
          echo "last=$last" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -z "$last" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Any doubt (no comparison, too many files to list) publishes.
          files=$(gh api "repos/$GH_REPO/compare/$last...$GITHUB_SHA" \
            --jq 'if (.files | length) >= 300 or .status == "behind" or .status == "diverged" then "*" else .files[].filename end') || files='*'
          if [ "$files" = '*' ] || grep -qE "$ships" <<<"$files"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing that ships changed since $last: no test build." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish the test build
        if: steps.ships.outputs.changed == 'true'
        env:
          LAST: ${{ steps.ships.outputs.last }}
        run: |
          set -e
          version=$(python3 scripts/release.py version)
          if gh api "repos/$GH_REPO/git/ref/tags/$version" >/dev/null 2>&1 ||
             gh api "repos/$GH_REPO/git/ref/tags/v$version" >/dev/null 2>&1; then tagged=true; else tagged=false; fi
          tag=$(python3 scripts/release.py dev-version "$LAST" "$tagged")
          python3 scripts/release.py notes Unreleased --test-build "${tag##*-dev.}" > notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
            --title "ESPHome Freematics $tag (test build)" --notes-file notes.md
          gh release list --limit 100 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName' |
            { grep -E '^v?[0-9.]+-dev\.[0-9]+$' | grep -vx "$tag" || true; } | while read -r old; do
              gh release delete "$old" --yes --cleanup-tag
            done
          echo "Published test build $tag"

  # The one check the main ruleset would require: passes only when every check job above did,
  # so jobs can be added or renamed without touching the ruleset.
  ci:
    name: CI passed
    if: always()
    needs: [lint, tests, esphome]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Every check job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then exit 1; fi
