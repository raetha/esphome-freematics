# Bench test for ESPHome's modem component: the same power-key presses and
# modem settings as the board package, plus the co-processor link
# (freematics_link, reading GNSS), the buzzer and the battery voltage ADC, and
# nothing else (no SD card or uplink). With the co-processor link alone the
# modem synced (test 3b); the full config never hears the modem, so this adds
# the next pieces to find what gets in the way. The raw probe
# (bench-modem-probe.yaml) showed the module answers on these pins; this tells
# whether ESPHome's modem component reaches it when nothing else is running. If it does,
# something else in the full config gets in its way; if it doesn't, the
# modem component's own start-up is the problem.
#
# Paste this whole file over the car's config in ESPHome Device Builder, install,
# open the logs and leave them for three minutes. Look for "Modem synced" and
# "Cellular: PPP up". A PPP connection costs a few hundred bytes of data; nothing
# else is sent over LTE. Then put the normal config back.
# Secrets it uses: wifi_ssid, wifi_password, freematics_api_key.

substitutions:
  name: freematics-test           # your device's name in ESPHome, so it installs over the air
  modem_rx_pin: GPIO35
  modem_tx_pin: GPIO2
  cell_apn: hologram

esphome:
  name: ${name}
  on_boot:
    - priority: -100
      then:
        - script.execute: modem_power_on
        - script.execute: { id: beep, ms: 200 }

external_components:
  - source: github://raetha/esphome-freematics@dev
    refresh: 0s
    components: [freematics_link]

esp32:
  board: esp32dev
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  level: VERBOSE
  logs:
    modem: VERBOSE
    freematics_link: DEBUG
    wifi: INFO
    api: INFO
    api.service: INFO
    component: INFO
    scheduler: INFO

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  power_save_mode: none           # keeps the log connection steady
  reboot_timeout: 0s

api:
  encryption:
    key: !secret freematics_api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:

modem:
  id: cell
  model: SIM7070
  apn: ${cell_apn}
  rx_pin: ${modem_rx_pin}
  tx_pin: ${modem_tx_pin}
  baud_rate: 115200
  enable_on_boot: false           # enabled by modem_power_on, as in the board package
  reboot_timeout: 0s
  on_sync:
    - globals.set: { id: modem_synced, value: "true" }
    - logger.log: "Cellular: modem synced"
    - if:
        condition:
          lambda: return !id(modem_restarted);
        then:
          # First answer since the ESP32 started. Fix the module's serial speed
          # (stored in the module), so bytes it hears while it starts can never
          # set a wrong one; then restart it, as it may still be in a session
          # from before an update or a crash (the board can't cut its power).
          # It answers again in about 10 s, and that sync takes the else branch.
          - globals.set: { id: modem_restarted, value: "true" }
          - modem.send_at: "AT+IPR=115200"
          - delay: 1s
          - modem.send_at: "AT&W"
          - delay: 1s
          - if:
              condition:
                lambda: return true;
              then:
                - logger.log: "Cellular: restarting the module (AT+CFUN=1,1)"
                - modem.send_at: "AT+CFUN=1,1"
              else:
                - modem.send_at: "AT+CFUN=1"
        else:
          # The modem component powers the SIM down (AT+CFUN=0) to write the
          # APN, then sends AT+CFUN=4, which on the SIM7070 leaves the SIM off
          # ("+CME ERROR: SIM failure" until a power cycle). Full
          # functionality brings it back within a second. Bench test 3b.
          - delay: 1s
          - modem.send_at: "AT+CFUN=1"
  on_connect:
    - logger.log: "Cellular: PPP up"
  on_disconnect:
    - logger.log: "Cellular: PPP down"

# The co-processor link exactly as in the board package
uart:
  - id: coproc
    rx_pin: GPIO13
    tx_pin: GPIO14
    baud_rate: 115200
    rx_buffer_size: 512

freematics_link:
  id: coproc_link
  uart_id: coproc
  reset_pin:
    number: GPIO15
    ignore_strapping_warning: true
  gnss_interval: 2s
  battery_interval: 0s

sensor:
  # Battery voltage, as in the board package
  - platform: adc
    id: battery_voltage
    name: Battery voltage
    pin: GPIO36
    attenuation: 12db
    update_interval: 30s
    filters:
      - multiply: 11.0

output:
  - platform: gpio
    id: modem_pwrkey
    pin: GPIO27
  # The buzzer, as in the board package
  - platform: ledc
    id: buzzer
    pin: GPIO25
    frequency: 2000Hz

globals:
  - id: modem_restarted
    type: bool
    initial_value: "false"
  - id: modem_synced
    type: bool
    initial_value: "false"

script:
  - id: beep
    mode: queued
    parameters:
      ms: int
    then:
      - output.set_level: { id: buzzer, level: 50% }
      - delay: !lambda return ms;
      - output.turn_off: buzzer
      - delay: 150ms
  # The board package's power-on, copied (see its comments).
  - id: modem_power_on
    then:
      - repeat:
          count: 6
          then:
            - if:
                condition:
                  lambda: return !id(modem_synced);
                then:
                  - if:
                      condition:
                        lambda: return iteration % 3 == 2;
                      then:
                        - logger.log: "Cellular: no answer; holding PWRKEY 2.5 s to switch the module off"
                        - modem.disable:
                        - output.turn_on: modem_pwrkey
                        - delay: 2500ms
                        - output.turn_off: modem_pwrkey
                        - delay: 5s
                  - logger.log: "Cellular: pressing PWRKEY"
                  - output.turn_on: modem_pwrkey
                  - delay: 200ms
                  - output.turn_off: modem_pwrkey
                  - delay: 8s
                  - modem.enable:
                  - delay: 10s
