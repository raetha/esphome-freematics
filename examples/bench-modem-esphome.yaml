# Bench test for ESPHome's modem component on its own: the same power-key
# presses and modem settings as the board package, with nothing else on the
# board running (no co-processor link, SD card, buzzer or uplink). The raw probe
# (bench-modem-probe.yaml) showed the module answers on these pins; this tells
# whether ESPHome's modem component reaches it when nothing else is running. If it does,
# something else in the full config gets in its way; if it doesn't, the
# modem component's own start-up is the problem.
#
# Paste this whole file over the car's config in ESPHome Device Builder, install,
# open the logs and leave them for three minutes. Look for "Modem synced" and
# "Cellular: PPP up". A PPP connection costs a few hundred bytes of data; nothing
# else is sent over LTE. Then put the normal config back.
# Secrets it uses: wifi_ssid, wifi_password, freematics_api_key.

substitutions:
  name: freematics-eli            # the device's existing name, so it installs over the air
  modem_rx_pin: GPIO35
  modem_tx_pin: GPIO2
  cell_apn: hologram

esphome:
  name: ${name}
  on_boot:
    - priority: -100
      then:
        - script.execute: modem_power_on

esp32:
  board: esp32dev
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  level: VERBOSE
  logs:
    modem: VERBOSE
    wifi: INFO
    api: INFO
    api.service: INFO
    component: INFO
    scheduler: INFO

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  power_save_mode: none           # keeps the log connection steady
  reboot_timeout: 0s

api:
  encryption:
    key: !secret freematics_api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:

modem:
  id: cell
  model: SIM7070
  apn: ${cell_apn}
  rx_pin: ${modem_rx_pin}
  tx_pin: ${modem_tx_pin}
  baud_rate: 115200
  enable_on_boot: false           # enabled by modem_power_on, as in the board package
  reboot_timeout: 0s
  on_sync:
    - globals.set: { id: modem_synced, value: "true" }
    - logger.log: "Cellular: modem synced"
    # The modem component powers the SIM down (AT+CFUN=0) to write the APN, then
    # asks for AT+CFUN=4, which on the SIM7070 seems to leave the SIM unpowered
    # ("+CME ERROR: SIM failure"; the raw probe, which sends no CFUN, saw it READY).
    # Full functionality powers it up; the component's own later CFUN=1 is then a no-op.
    - delay: 1s
    - modem.send_at: "AT+CFUN?"
    - delay: 2s
    - modem.send_at: "AT+CFUN=1"
    - delay: 5s
    - modem.send_at: "AT+CPIN?"
  on_connect:
    - logger.log: "Cellular: PPP up"
  on_disconnect:
    - logger.log: "Cellular: PPP down"

output:
  - platform: gpio
    id: modem_pwrkey
    pin: GPIO27

globals:
  - id: modem_synced
    type: bool
    initial_value: "false"

script:
  # The board package's power-on: enable the modem component, then press the
  # power key (200 ms, as the Freematics library does) until it has synced.
  - id: modem_power_on
    then:
      - modem.enable:
      - repeat:
          count: 5
          then:
            - if:
                condition:
                  lambda: return !id(modem_synced);
                then:
                  - logger.log: "Cellular: pressing PWRKEY"
                  - output.turn_on: modem_pwrkey
                  - delay: 200ms
                  - output.turn_off: modem_pwrkey
                  - delay: 10s
