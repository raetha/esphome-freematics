# One car reporting live to Home Assistant over the native API, through a
# WireGuard tunnel home (docs/configurations.md, docs/networking.md).
#
# Paste this whole file into a new device in ESPHome Device Builder, change the
# substitutions below, and install. Everything else comes from GitHub.
# Secrets it uses (Device Builder -> Secrets): wifi_ssid, wifi_password,
# freematics_api_key, freematics_ota_password, and the wg_* keys below.
# Add the device to Home Assistant once while it's on home Wi-Fi.

substitutions:
  name: freematics-car1
  friendly_name: Car 1
  cell_apn: hologram

packages:
  freematics:
    url: https://github.com/raetha/esphome-freematics
    ref: dev            # or a test build tag such as 0.1.0-dev.3
    refresh: 0s         # fetch on every build while things are changing
    files:
      - packages/freematics-oneplus-b.yaml
      - packages/wifi-first.yaml
      - packages/uplink-home-assistant.yaml

external_components:
  - source: github://raetha/esphome-freematics@dev
    refresh: 0s
    components: [sd_card]

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    # More networks: another - ssid: / password: pair.

# The package makes the device dial Home Assistant; the key is per device
# (32 random bytes, base64: Device Builder's new-device wizard makes one).
api:
  encryption:
    key: !secret freematics_api_key

ota:
  - platform: esphome
    password: !secret freematics_ota_password

# Tunnel home so Home Assistant stays private. Only HA's address goes through
# it; everything else, including SNTP, goes direct.
wireguard:
  address: !secret wg_address
  private_key: !secret wg_private_key
  peer_endpoint: !secret wg_endpoint
  peer_public_key: !secret wg_peer_public_key
  peer_preshared_key: !secret wg_preshared_key
  peer_allowed_ips:
    - !secret wg_allowed_ip       # Home Assistant's address, e.g. 192.168.1.10/32
  peer_persistent_keepalive: 25s  # sent only when nothing else was; keeps the carrier's NAT open
