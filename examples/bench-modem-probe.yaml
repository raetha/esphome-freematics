# Bench probe for the cellular module, without ESPHome's modem component: press
# PWRKEY and send "AT" the way the Freematics library does, and log every byte
# the module sends back. It answers one question: does the module talk on these
# pins at all? Uses no cellular data (no data connection is opened).
#
# Paste this whole file into a new device in ESPHome Device Builder (or over the
# car's config for one install), install, open the logs and leave them for two
# minutes. Lines starting "<<<" are the module talking. Then put the normal
# config back.
#
# If nothing answers, try the library's other pins (probe_rx_pin: GPIO32,
# probe_tx_pin: GPIO33), then a longer press (pwrkey_press: 1500ms).
# Secrets it uses: wifi_ssid, wifi_password, freematics_ota_password,
# freematics_api_key.

substitutions:
  name: freematics-eli            # the device's existing name, so it installs over the air
  probe_rx_pin: GPIO35
  probe_tx_pin: GPIO2
  pwrkey_press: 200ms             # the library's press; a longer one (1500ms) is the next thing to try

esphome:
  name: ${name}

esp32:
  board: esp32dev
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  level: DEBUG

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  power_save_mode: none           # keeps the log connection steady

api:
  encryption:
    key: !secret freematics_api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret freematics_ota_password

output:
  - platform: gpio
    id: pwrkey
    pin: GPIO27

globals:
  - id: tries
    type: int
    initial_value: "0"
  - id: answered
    type: bool
    initial_value: "false"

uart:
  - id: probe
    rx_pin: ${probe_rx_pin}
    tx_pin: ${probe_tx_pin}
    baud_rate: 115200
    rx_buffer_size: 1024
    debug:
      direction: BOTH
      dummy_receiver: true
      after:
        delimiter: "\n"
        timeout: 200ms
      sequence:
        - lambda: |-
            UARTDebug::log_string(direction, bytes);
            if (direction == uart::UART_DIRECTION_RX && !id(answered)) {
              std::string s(bytes.begin(), bytes.end());
              if (s.find("OK") != std::string::npos) {
                id(answered) = true;
                ESP_LOGI("probe", "The module answered after %d tries", id(tries));
                id(module_info).execute();
              }
            }

script:
  # What the module says about itself and the network; none of it uses data.
  - id: module_info
    then:
      - delay: 1s
      - uart.write: { id: probe, data: "ATI\r" }
      - delay: 2s
      - uart.write: { id: probe, data: "AT+CPIN?\r" }
      - delay: 2s
      - uart.write: { id: probe, data: "AT+CSQ\r" }
      - delay: 2s
      - uart.write: { id: probe, data: "AT+CPSI?\r" }
      - delay: 2s
      - uart.write: { id: probe, data: "AT+CGDCONT?\r" }

interval:
  # Like CellSIMCOM::begin(): press, wait, ask, up to 30 times. The press is
  # repeated only every fourth try, so a long press doesn't switch the module
  # back off while it starts.
  - interval: 3s
    then:
      - if:
          condition:
            lambda: return !id(answered) && id(tries) < 30;
          then:
            - lambda: id(tries)++;
            - if:
                condition:
                  lambda: return id(tries) % 4 == 1;
                then:
                  - logger.log:
                      format: "Pressing PWRKEY (try %d)"
                      args: [id(tries)]
                  - output.turn_on: pwrkey
                  - delay: ${pwrkey_press}
                  - output.turn_off: pwrkey
                  - delay: 1s
            - uart.write: { id: probe, data: "AT\r" }
      - if:
          condition:
            lambda: return !id(answered) && id(tries) == 30;
          then:
            - lambda: id(tries)++;
            - logger.log:
                level: WARN
                format: "No answer from the module on RX ${probe_rx_pin} / TX ${probe_tx_pin}"
