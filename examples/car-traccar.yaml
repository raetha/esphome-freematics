# One car reporting to Traccar: the lowest-data configuration (docs/configurations.md).
# Copy into your ESPHome config folder, rename it, and set the substitutions and
# secrets. CI validates and compiles it with examples/secrets.example.yaml.
#
# To use this repository instead of local copies (how test builds are tried,
# see README "Test builds"), replace both !include lines and the local source with:
#   packages:
#     freematics:
#       url: https://github.com/raetha/esphome-freematics
#       ref: dev          # or a test build tag such as 0.1.0-dev.3
#       files: [packages/freematics-oneplus-b.yaml, packages/wifi-first.yaml, packages/uplink-traccar.yaml]
#   external_components:
#     - source: github://raetha/esphome-freematics@dev
#       components: [traccar_uplink]

substitutions:
  name: freematics-car1
  friendly_name: Car 1
  cell_apn: hologram
  traccar_host: traccar.example.com    # your Traccar server; UDP port 5027 must be open
  traccar_device_id: car1              # the device's identifier in Traccar

packages:
  board: !include ../packages/freematics-oneplus-b.yaml
  wifi_first: !include ../packages/wifi-first.yaml
  uplink: !include ../packages/uplink-traccar.yaml

external_components:
  - source:
      type: local
      path: ../components
    components: [traccar_uplink]

wifi:
  networks:
    - ssid: !secret wifi_home_ssid
      password: !secret wifi_home_password
    - ssid: !secret wifi_second_ssid
      password: !secret wifi_second_password

# Updates over the air while on Wi-Fi (a firmware is about 1 MB of LTE data);
# logs over USB.
ota:
  - platform: esphome
    encryption:
      key: !secret ota_encryption_key
