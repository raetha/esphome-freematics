# One car reporting to Traccar: the lowest-data configuration (docs/configurations.md).
#
# Paste this whole file into a new device in ESPHome Device Builder, change the
# substitutions below, and install. Everything else comes from GitHub.
# Secrets it uses (Device Builder -> Secrets): wifi_ssid, wifi_password,
# freematics_api_key.

substitutions:
  name: freematics-car1
  friendly_name: Car 1
  cell_apn: hologram
  traccar_host: traccar.example.com    # your Traccar server; UDP port 5027 must be open
  traccar_device_id: car1              # the device's identifier in Traccar
  # Optional settings, with their defaults: uncomment a line to change it.
  # The board: cellular module, GPS, beeps, logs
  # modem_model: SIM7070          # the cellular module: SIM7070 (SIM7070G), or SIM7600 (untested)
  # modem_rx_pin: GPIO35          # the module's serial pins; co-processor version 1.3 boards use GPIO32...
  # modem_tx_pin: GPIO2           # ...and GPIO33
  # beep_on_boot: "true"          # a 200 ms beep when the firmware has started
  # beep_on_network: "true"       # a 50 ms beep when Wi-Fi or cellular comes up, as the stock firmware does
  # modem_restart_on_boot: "true" # restart the module the first time it answers after an ESP32 restart it may have stayed on through (not after a power-on or a wake)
  # modem_pwrkey_press: 200ms     # the Freematics library's press
  # modem_pwrkey_tries: "6"       # presses until the module answers; every third try first switches it off (a stuck module)
  # modem_wifi_wait: 10s          # at start, wait this long for Wi-Fi before starting the module (at home it isn't started at all)
  # modem_boot_wait: 8s           # after a press, before ESPHome's modem component starts talking to the module
  # modem_pwrkey_wait: 10s        # then this long for it to answer before the next try
  # modem_sim_workarounds: "true" # "false": no AT+CFUN=1 after each sync and no modem_restart_after restarts, to test ESPHome's modem component handling the SIM itself
  # modem_test_lose_sim: "false"  # testing only: "true" restarts the module right after starting it, which can leave its SIM unread
  # modem_restart_after: 15min    # restart the module when it answers but hasn't connected this long (a safety net: a SIM it failed to read stays unread)
  # modem_reboot_timeout: 0s      # restart the device when LTE stays down this long; 0s: never (LTE is off at home on Wi-Fi)
  # gnss_poll_interval: 2s        # reading the GNSS is local: costs no data
  # sntp_interval: 12h            # SNTP is the fallback clock; each sync is about 300 bytes over LTE (GPS time is free)
  # logger_level: INFO            # the device's log: INFO (what happened: trips, sends, networks, sleep), DEBUG (to troubleshoot), VERBOSE, WARN
  # coproc_log_level: ${logger_level}  # the co-processor link's log; VERBOSE also logs every GPS reply (with logger_level: VERBOSE)
  # motion_threshold: 100mg       # a change this big between motion sensor samples (10 ms apart) counts as the car being moved (a door, getting in, the road)
  # impact_threshold: 4g          # acceleration beyond gravity that counts as an impact, reported at once (0g: none); hard braking is under 1 g
  # gnss_restart: 10min           # no GNSS fix this long: the GNSS is switched off and on again, as the stock firmware does (0s: never)
  # trip_moving_speed: "6"        # km/h: at or above, the car is moving
  # trip_start_fixes: "3"         # a trip starts after this many fast fixes in a row (2 s apart)...
  # trip_start_distance: 50m      # ...this far from where the car was parked (GPS drift doesn't start trips)
  # trip_start_motion: 300s       # a trip starts only this soon after the motion sensor felt the car move (getting in, driving), and is dated at most this much earlier than GPS first saw it moving; 0s: GPS alone
  # trip_stop_delay: 180s         # below moving speed this long: the trip is over (telelogger: 180 s)

  # Wi-Fi first
  # lte_back_after: 30s     # Wi-Fi gone this long: turn LTE back on
  # wifi_pause_speed: "10"  # km/h: at or above, with no Wi-Fi connected, stop searching for Wi-Fi; "1000": never pause
  # wifi_resume_after: "30" # seconds below that speed (or without a GNSS fix) before searching again
  # wifi_search_time: "120" # seconds: parked, stop searching after this long without a known network, until the car moves; "0": search on
  # wifi_power_save: light  # Wi-Fi power saving: light, or none if an access point keeps dropping the device
  # lte_on_wifi: "false"    # "true" for bench tests: LTE stays on beside Wi-Fi, so its logs reach Device Builder

  # Traccar
  # traccar_protocol: teltonika         # or freematics: the stock firmware's text protocol, unacknowledged and about 4 times the data; for checking a server
  # traccar_port: "5027"                # Traccar's Teltonika port (UDP); 5170 for freematics
  # traccar_send_interval: 60s          # batch fixes this long before sending (sooner on a stop or a full batch)
  # traccar_moving_interval: 10s        # a fix at least this often while moving
  # traccar_turn_angle: "30"            # degrees: a turn this sharp records a fix early
  # traccar_altitude: "true"            # send altitude: 2 bytes per position, about 7% more data while driving
  # traccar_heartbeat_interval: 15min   # one record this often while parked; 0s: none (telelogger: 15 min)

  # SD card: records (sd-traccar.yaml)
  # traccar_stored_records: "50000"     # 28 bytes each: 50,000 is 1.4 MB, about 140 hours of driving
  # traccar_store_writer_task: "true"   # write to the card from a task of its own; "false": from the main loop (tens of ms per record)

  # SD card: log (sd-logs.yaml)
  # sd_log_level: ${logger_level}  # what goes into the log on the card (at most logger_level)
  # sd_log_max_size: 1MB      # two files at most: 2 MB

  # SD card: log download (sd-logs-download.yaml)
  # sd_log_password: !secret car1_log_password  # required with sd-logs-download.yaml: 8 characters or more, a secret for each dongle
  # sd_log_username: logs     # the download's username

  # Sleep while parked (standby.yaml)
  # standby_voltage: "13.2"       # V: at or above, the car is on (its 12 V system is charging) while the dongle is awake
  # standby_voltage_rise: "0.5"   # V: asleep, a rise this big above the lowest voltage since sleeping means the car is on
  # standby_min_voltage: "9.0"    # V: below, the dongle is powered over USB, not the OBD port
  # standby_on_usb: "true"        # on USB power, sleep once the motion sensor has felt nothing for standby_after; "false": stay awake (a bench)
  # standby_after: "600"          # s: car off and still this long, then sleep (the stop record goes out at 180 s)
  # standby_check: "60"           # s: deep sleep between voltage checks (each costs about half a second awake)
  # standby_heartbeat: "6"        # hours: wake fully to report one record this often; "0": never
  # standby_motion_mg: "150"      # mg: a change this big between samples wakes it (doors, towing); "0": no motion wake
  # standby_report_time: "180"    # s: how long a heartbeat wake waits to report before sleeping again
  # standby_stay_awake: 30min     # the "Stay awake" switch turns itself off after this

  # WireGuard tunnel home (wireguard.yaml)
  # wireguard_address: !secret car1_wg_address        # required with wireguard.yaml: this dongle's tunnel address, e.g. 10.66.0.11
  # wireguard_private_key: !secret car1_wg_private_key  # required with wireguard.yaml: this dongle's private key
  # wireguard_peer_endpoint: !secret wg_endpoint      # required with wireguard.yaml: the home server's public name or address
  # wireguard_peer_public_key: !secret wg_peer_public_key  # required with wireguard.yaml: the home server's public key
  # wireguard_allowed_ip: !secret wg_allowed_ip       # required with wireguard.yaml: what goes through the tunnel, e.g. 192.168.1.0/24
  # wireguard_on_wifi: "true"       # tunnel up on Wi-Fi
  # wireguard_ssids: ""             # only on these Wi-Fi networks, comma-separated ("home,office"); "": any
  # wireguard_on_cellular: "false"  # tunnel up on cellular too (a handshake about every 2 minutes while it carries traffic)

  # Home Assistant integration (uplink-ha-webhook.yaml)
  # ha_webhook_url: !secret car1_webhook_url  # required with uplink-ha-webhook.yaml: the dongle's webhook URL from the integration, a secret for each dongle
  # ha_send_interval: 5min            # batch records this long before sending (at once on a trip start, stop or heartbeat, and before sleeping)
  # ha_moving_interval: 10s           # a record at least this often while moving
  # ha_heartbeat_interval: 15min      # one record this often while parked; 0s: none
  # ha_altitude: "true"               # send altitude (a byte or two per record)
  # End of the optional settings.

packages:
  freematics:
    url: https://github.com/raetha/esphome-freematics
    ref: dev            # or a test build tag such as 0.1.0-dev.3
    refresh: 0s         # fetch on every build while things are changing
    files:
      - packages/freematics-oneplus-b.yaml
      - packages/wifi-first.yaml
      - packages/uplink-traccar.yaml
      # Optional: the SD card, keeping records (and the log) on it
      # - packages/sd-card.yaml
      # - packages/sd-traccar.yaml
      # - packages/sd-logs.yaml
      # Optional: download that log over Wi-Fi (set sd_log_password: !secret car1_log_password above)
      # - packages/sd-logs-download.yaml
      # Optional: sleep while parked, waking when the car is turned on or moved
      # - packages/standby.yaml
      # Optional: a WireGuard tunnel home on chosen Wi-Fi networks (or cellular),
      # for updates from Device Builder away from home (set the wireguard_*
      # substitutions above)
      # - packages/wireguard.yaml
      # Optional: also report to Home Assistant's Freematics integration (set
      # ha_webhook_url above to this dongle's webhook URL secret, as in car-ha-integration.yaml)
      # - packages/uplink-ha-webhook.yaml

external_components:
  - source: github://raetha/esphome-freematics@dev
    refresh: 0s
    components: [freematics_link, icm426xx, trip_tracker, tracker_uplink, sd_card, file_queue, file_logger]

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    # More networks: another - ssid: / password: pair.

# Updates and logs over the air from ESPHome Device Builder, while the device is
# on Wi-Fi. On LTE the carrier's NAT keeps it unreachable, so neither uses data.
ota:
  - platform: esphome
    id: device_ota                    # standby.yaml holds off sleep during an update
    encryption:                       # uses the API key below

# Only so Device Builder can show logs: nothing connects unless a log window is
# open. Ignore the device if Home Assistant offers to add it.
api:
  encryption:
    key: !secret freematics_api_key   # 32 random bytes, base64 (Device Builder's new-device wizard makes one)
  reboot_timeout: 0s                  # never restart for want of a connection
