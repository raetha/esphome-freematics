# One car's dongle. Copy this file into your ESPHome config folder, rename it,
# and set the substitutions and secrets. CI validates and compiles it with
# examples/secrets.example.yaml.
#
# The package can come from this repository instead of a local copy, which is
# how test builds are tried (see README "Test builds"):
#   packages:
#     board:
#       url: https://github.com/raetha/esphome-freematics
#       ref: dev            # or a test build tag such as 0.1.0-dev.3
#       files: [packages/freematics-oneplus-b.yaml]

substitutions:
  name: freematics-car1
  friendly_name: Car 1
  cell_apn: hologram
  modem_model: SIM7070

packages:
  board: !include ../packages/freematics-oneplus-b.yaml

# Home Wi-Fi first: while it's connected ESP-IDF routes through it (route
# priority Wi-Fi 100 over PPP 20); otherwise traffic goes over LTE.
wifi:
  networks:
    - ssid: !secret wifi_home_ssid
      password: !secret wifi_home_password
    - ssid: !secret wifi_second_ssid
      password: !secret wifi_second_password
  reboot_timeout: 0s   # never reboot because the car is away from home

# The package sets up the native API to dial Home Assistant itself; the key
# is per device. Add the device to HA once while it's on home Wi-Fi.
api:
  encryption:
    key: !secret api_encryption_key

# Install updates while the car is on Wi-Fi: a firmware is about 1 MB of LTE data.
ota:
  - platform: esphome
    password: !secret ota_password

# Tunnel home so Home Assistant stays private. Only HA's address goes through
# it (peer_allowed_ips); everything else, including SNTP, goes direct.
# docs/networking.md has the server side and the data-use estimate.
wireguard:
  address: !secret wg_address
  private_key: !secret wg_private_key
  peer_endpoint: !secret wg_endpoint
  peer_public_key: !secret wg_peer_public_key
  peer_preshared_key: !secret wg_preshared_key
  peer_allowed_ips:
    - !secret wg_allowed_ip       # Home Assistant's address, e.g. 192.168.1.10/32
  peer_persistent_keepalive: 25s  # sent only when nothing else was; keeps the carrier's NAT open
