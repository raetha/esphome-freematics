# Report the board package's trips to Home Assistant through the Freematics
# integration (https://github.com/raetha/ha-freematics): records go to a webhook as compact
# batches over HTTPS (about 11 bytes a record while driving, sent as base64
# text: about 15), sent every
# ha_send_interval and at once on trip starts, stops and heartbeats. Home
# Assistant answers each batch; until it does, the records stay queued and go
# out again. See docs/configurations.md.
#
# Needs the board package and the tracker_uplink component from this
# repository's components/ (external_components: in the device config), and the
# webhook URL the integration shows when the device is added.
# Works beside uplink-traccar.yaml, to report to both.
#
# Substitution a device config must set: ha_webhook_url (from a secret, one per
# dongle: each has its own webhook).

substitutions:
  ha_send_interval: 2min            # batch records this long before sending (sooner on a trip start, stop or heartbeat)
  ha_moving_interval: 10s           # a record at least this often while moving
  ha_heartbeat_interval: 15min      # one record this often while parked; 0s: none
  ha_altitude: "true"               # send altitude (a byte or two per record)

tracker_uplink:
  - id: ha_uplink
    protocol: home_assistant
    url: ${ha_webhook_url}
    send_interval: ${ha_send_interval}
    moving_interval: ${ha_moving_interval}
    heartbeat_interval: ${ha_heartbeat_interval}
    altitude: ${ha_altitude}
