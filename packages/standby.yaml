# Sleep while parked, like the stock firmware's standby but deeper: once the
# car has been off and still for standby_after, the device sends what it has,
# switches the cellular module off (AT+CPOWD=1, AT+CPOF on a SIM7600), puts the GNSS and co-processor
# in low power (ATGPSOFF, ATLP) and puts the ESP32 into deep sleep.
#
# Every standby_check it wakes for a fraction of a second, reads the battery
# voltage and, unless the car is on, sleeps again before Wi-Fi or the modem
# start. The car counts as on when the 12 V system is charging (at or above
# standby_voltage, about 13.2 V: the alternator, or a hybrid's DC-DC converter
# while the car is on or charging). Every standby_heartbeat it wakes fully to
# report one record to Traccar, then sleeps again.
#
# Powered over USB instead of the OBD port (the voltage reads below
# standby_min_voltage), there's no 12 V to tell whether the car is on: it
# sleeps once the motion sensor has felt nothing for standby_after (and no trip
# is under way), and only motion or a heartbeat wakes it; standby_on_usb:
# "false" keeps it awake on USB (a bench). While it sleeps it can't be updated
# over Wi-Fi: start the car, move or tap the dongle, or unplug it and plug it
# back in, and it stays awake for standby_after.
#
# It also wakes when the car moves while it sleeps (towing, someone getting
# in): before sleeping it sets the motion sensor's wake-on-motion, which
# latches a flag the minute check reads, so no interrupt pin is needed. The
# sensor is found by its ID at run time: the ICM-42627 (WHO_AM_I 0x20, the
# Model B's, as Freematics' own driver identifies it). Without a known sensor,
# the device sleeps as before, waking on voltage and heartbeats only.
#
# Needs the board package, an uplink package (traccar_uplink with the id in standby_uplink)
# and the battery_voltage sensor; the SD card packages are synced before sleep.

substitutions:
  standby_uplink: traccar       # the uplink to empty before sleeping: traccar, or ha_uplink in the Home Assistant integration configuration
  standby_voltage: "13.2"       # V: at or above, the car is on (its 12 V system is charging)
  standby_min_voltage: "9.0"    # V: below, the dongle is powered over USB, not the OBD port
  standby_on_usb: "true"        # on USB power, sleep once the motion sensor has felt nothing for standby_after; "false": stay awake (a bench)
  standby_after: "600"          # s: car off and still this long, then sleep (Traccar's stop record goes out at 180 s)
  standby_check: "60"           # s: deep sleep between voltage checks (each costs about half a second awake)
  standby_heartbeat: "6"        # hours: wake fully to report one record this often; "0": never
  standby_motion_mg: "150"      # mg: a change this big between samples wakes it (doors, towing); "0": no motion wake
  standby_report_time: "180"    # s: how long a heartbeat wake waits to report before sleeping again

deep_sleep:
  id: sleeper

# Each check wake is a start that never lasts the minute safe mode waits for;
# the check clears its count, or ten checks would start safe mode.
safe_mode:
  id: safe_mode_ctl

globals:
  - id: parked_s                # seconds the car has been off and still
    type: uint32_t
    initial_value: "0"
  - id: heartbeat_wake          # this start is a heartbeat wake: sleep again once reported
    type: bool
    initial_value: "false"

esphome:
  on_boot:
    # Just after the sensors are set up (600), before the co-processor link
    # (599), Wi-Fi and the modem: on a timer wake, read the voltage and go back
    # to sleep unless the car is on or a heartbeat is due.
    - priority: 599.5
      then:
        - lambda: |-
            // Counts the timer wakes since the last time the device stayed
            // awake; kept in RTC memory through deep sleep.
            static RTC_DATA_ATTR uint32_t checks = 0;
            bool timer_wake = esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_TIMER;
            if (timer_wake) {
              id(battery_voltage).update();
              float v = id(battery_voltage).state;
              // On USB power there's no 12 V to read: only motion or a heartbeat wakes it.
              bool usb = !std::isnan(v) && v < ${standby_min_voltage};
              bool car_on = std::isnan(v) || (usb ? !${standby_on_usb} : v >= ${standby_voltage});
              // The ICM-42627's wake-on-motion flags (INT_STATUS2, cleared by reading)
              bool moved = false;
              uint8_t reg = 0x75, who = 0, status = 0;
              if (id(imu_bus)->write_readv(0x68, &reg, 1, &who, 1) == i2c::ERROR_OK && who == 0x20) {
                reg = 0x37;
                if (id(imu_bus)->write_readv(0x68, &reg, 1, &status, 1) == i2c::ERROR_OK)
                  moved = (status & 0x07) != 0;
              }
              checks++;
              const uint32_t check_s = ${standby_check};
              bool heartbeat = ${standby_heartbeat} > 0 &&
                               checks * check_s >= static_cast<uint32_t>(${standby_heartbeat}) * 3600;
              if (!car_on && !moved && !heartbeat) {
                // Nothing logged here: the SD card log is written by a task,
                // and a sleep in the middle of a card write could damage it.
                // The short wait lets a write already under way finish.
                vTaskDelay(pdMS_TO_TICKS(200));
                id(safe_mode_ctl).clean_rtc();
                esp_sleep_enable_timer_wakeup(static_cast<uint64_t>(check_s) * 1000000ULL);
                esp_deep_sleep_start();
              }
              if (moved)
                id(motion_ms) = millis() | 1;  // the motion that woke it counts for a trip start
              ESP_LOGI("standby", "Woke: %.2f V, %s", v,
                       car_on ? "the car is on" : moved ? "the car moved" : "heartbeat");
              id(heartbeat_wake) = !car_on && !moved;
            }
            checks = 0;
            // Staying awake: release the pins held through sleep.
            gpio_hold_dis(GPIO_NUM_27);
            gpio_hold_dis(GPIO_NUM_15);
            gpio_hold_dis(GPIO_NUM_25);
            gpio_deep_sleep_hold_dis();

interval:
  - interval: 10s
    then:
      - lambda: |-
          // Still: on the OBD port, the car is off (its 12 V system isn't
          // charging); on USB power, the motion sensor has felt nothing for
          // the last 10 s (without a supported sensor, it never sleeps on USB).
          float v = id(battery_voltage).state;
          bool still;
          if (std::isnan(v))
            still = false;
          else if (v < ${standby_min_voltage})
            still = ${standby_on_usb} && id(motion_sensor) &&
                    (id(motion_ms) == 0 || millis() - id(motion_ms) >= 10000);
          else
            still = v < ${standby_voltage};
          if (still && !id(${standby_uplink}).is_moving())
            id(parked_s) += 10;
          else
            id(parked_s) = 0;
      - if:
          condition:
            lambda: |-
              if (id(enter_standby).is_running())
                return false;
              if (id(heartbeat_wake))
                return id(parked_s) >= ${standby_report_time} ||
                       (id(parked_s) >= 60 && id(${standby_uplink}).queue_size() == 0 && id(${standby_uplink}).records_sent() > 0);
              return id(parked_s) >= ${standby_after};
          then:
            - script.execute: enter_standby

script:
  - id: enter_standby
    mode: single
    then:
      - logger.log: "Standby: parked; sending what's waiting, then sleeping"
      - lambda: id(${standby_uplink}).flush();
      - wait_until:
          condition:
            lambda: return id(${standby_uplink}).queue_size() == 0;
          timeout: 60s
      - lambda: id(coproc_link).enter_standby();
      - wait_until:
          condition:
            lambda: return id(coproc_link).in_standby();
          timeout: 5s
      - delay: 1s                 # the ATLP reply
      - if:
          condition:
            lambda: return id(modem_synced);
          then:
            # Out of PPP and CMUX first, then the module's own power-down.
            - modem.disable:
            - delay: 5s
            # The module's own power-down, as Freematics' library sends it
            - modem.send_at: !lambda 'return std::string("${modem_model}") == "SIM7070" ? "AT+CPOWD=1" : "AT+CPOF";'
            - delay: 3s
      # Wake-on-motion at the standby threshold; the minute check reads its flag.
      - script.execute: { id: motion_arm, mg: !lambda "return ${standby_motion_mg};" }
      - script.wait: motion_arm
      - if:
          condition:
            lambda: return ${standby_motion_mg} > 0 && id(motion_arm_ok);
          then:
            - logger.log:
                format: "Motion wake set (%d mg)"
                args: ["${standby_motion_mg}"]
      - logger.log: "Standby: sleeping"
      - lambda: |-
          // Hold the power key released, the co-processor out of reset and
          // the buzzer quiet while the ESP32 sleeps (its pins float otherwise).
          gpio_hold_en(GPIO_NUM_27);
          gpio_hold_en(GPIO_NUM_15);
          gpio_hold_en(GPIO_NUM_25);
          gpio_deep_sleep_hold_en();
      - deep_sleep.enter:
          id: sleeper
          sleep_duration: ${standby_check}s
