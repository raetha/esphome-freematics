# Freematics ONE+ Model B board package for ESPHome 2026.11+
#
# What every dongle has, whatever it reports to: pins, the cellular modem and
# its power key, the co-processor link with the internal GNSS, the motion
# sensor, battery voltage, and the trip tracker (trips), which decides when a
# trip starts and stops for every uplink package (packages/uplink-*.yaml). See
# the examples/ configs, docs/hardware.md (pins and sources) and
# docs/configurations.md.
#
# The device config loads the components (external_components: components:
# [freematics_link, icm426xx, trip_tracker, ...]).
#
# Substitutions a device config must set: name, friendly_name, cell_apn.

substitutions:
  modem_model: SIM7070          # the cellular module: SIM7070 (SIM7070G), or SIM7600 (untested)
  modem_rx_pin: GPIO35          # the module's serial pins; co-processor version 1.3 boards use GPIO32...
  modem_tx_pin: GPIO2           # ...and GPIO33
  beep_on_boot: "true"          # a 200 ms beep when the firmware has started
  beep_on_network: "true"       # a 50 ms beep when Wi-Fi or cellular comes up, as the stock firmware does
  modem_restart_on_boot: "true" # restart the module the first time it answers after each boot (it keeps power across ESP32 restarts)
  modem_pwrkey_press: 200ms     # the Freematics library's press
  modem_pwrkey_tries: "6"       # presses until the module answers; every third try first switches it off (a stuck module)
  modem_wifi_wait: 10s          # at start, wait this long for Wi-Fi before starting the module (at home it isn't started at all)
  modem_boot_wait: 8s           # after a press, before ESPHome's modem component starts talking to the module
  modem_pwrkey_wait: 10s        # then this long for it to answer before the next try
  modem_restart_after: 4min     # restart the module when it answers but hasn't connected this long (a SIM it failed to read stays unread)
  modem_reboot_timeout: 0s      # restart the device when LTE stays down this long; 0s: never (LTE is off at home on Wi-Fi)
  gnss_poll_interval: 2s        # reading the GNSS is local: costs no data
  sntp_interval: 12h            # SNTP is the fallback clock; each sync is about 300 bytes over LTE (GPS time is free)
  coproc_log_level: DEBUG       # the co-processor link's log; VERBOSE also logs every GPS reply (with logger_level: VERBOSE)
  logger_level: DEBUG           # the device's log: DEBUG, VERBOSE, INFO, WARN...
  motion_threshold: 100mg       # a change this big between motion sensor samples (10 ms apart) counts as the car being moved (a door, getting in, the road)
  impact_threshold: 4g          # acceleration beyond gravity that counts as an impact, reported at once (0g: none); hard braking is under 1 g
  gnss_restart: 10min           # no GNSS fix this long: the GNSS is switched off and on again, as the stock firmware does (0s: never)
  trip_moving_speed: "6"        # km/h: at or above, the car is moving
  trip_start_fixes: "3"         # a trip starts after this many fast fixes in a row (2 s apart)...
  trip_start_distance: 50m      # ...this far from where the car was parked (GPS drift doesn't start trips)
  trip_start_motion: 300s       # a trip starts only this soon after the motion sensor felt the car move (getting in, driving); 0s: GPS alone
  trip_stop_delay: 180s         # below moving speed this long: the trip is over (telelogger: 180 s)

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: raetha.esphome-freematics
    version: "0.1.0"
  on_boot:
    - priority: -100
      then:
        - script.execute: modem_power_on
        - if:
            condition:
              lambda: return ${beep_on_boot};
            then:
              - script.execute: { id: beep, ms: 200 }

esp32:
  board: esp32dev
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # Each network interface keeps its own DNS servers, and the default
      # interface's are used. Otherwise lwIP's DNS servers are global: a
      # cellular connection that comes up (or half comes up) replaces Wi-Fi's
      # for good, and names stop resolving over Wi-Fi.
      CONFIG_ESP_NETIF_SET_DNS_PER_DEFAULT_NETIF: y

logger:
  level: ${logger_level}
  baud_rate: 115200
  logs:
    freematics_link: ${coproc_log_level}

# Both set the same system clock. GPS time is free and checked every minute once
# there's a fix; SNTP covers the time before the first fix, at boot and then
# rarely, since over LTE each sync costs a DNS lookup and an NTP exchange.
time:
  - platform: freematics_link
    id: gps_time
  - platform: sntp
    id: sntp_time
    update_interval: ${sntp_interval}

# Logs uptime and why the last restart happened (power-on, brownout, panic,
# watchdog...) whenever a log viewer connects.
debug:
  update_interval: 300s

# ---------- Cellular (xBee socket) ----------
modem:
  id: cell
  model: ${modem_model}
  apn: ${cell_apn}
  rx_pin: ${modem_rx_pin}
  tx_pin: ${modem_tx_pin}             # GPIO2 is a strapping pin: ESPHome warns, harmlessly (only matters at boot)
  baud_rate: 115200
  enable_on_boot: false               # powered on by modem_power_on
  reboot_timeout: ${modem_reboot_timeout}
  update_interval: 120s
  on_sync:
    - globals.set: { id: modem_synced, value: "true" }
    - script.execute: modem_watchdog
    # The module's first answer after the ESP32 starts, and any answer after
    # three syncs without a connection (a dropped connection counts as three),
    # restart it: after a drop the SIM7070 refuses to start PPP again ("Failed
    # to enter PPP") until it's restarted, and it keeps power across ESP32
    # restarts (the board can't cut it). It answers again about 10 s later.
    - lambda: |-
        bool first = !id(modem_restarted);
        id(modem_restarted) = true;
        id(modem_syncs)++;
        bool stuck = id(modem_syncs) > 3;
        if (stuck)
          ESP_LOGW("cellular", "No connection after %u tries: restarting the module", (unsigned) (id(modem_syncs) - 1));
        id(modem_first_sync) = first;
        id(modem_restart_now) = (first && ${modem_restart_on_boot}) || stuck;
        if (id(modem_restart_now))
          id(modem_syncs) = 0;
    - if:
        condition:
          lambda: return id(modem_first_sync);
        then:
          # Fix the module's serial speed (it stores it itself), so bytes it
          # hears while it starts can never set a wrong one.
          - modem.send_at: "AT+IPR=115200"
          - delay: 1s
    - if:
        condition:
          lambda: return id(modem_restart_now);
        then:
          - logger.log: "Cellular: restarting the module (AT+CFUN=1,1)"
          - modem.send_at: "AT+CFUN=1,1"
        else:
          # The modem component powers the SIM down (AT+CFUN=0) to write the
          # APN, then sends AT+CFUN=4, which on the SIM7070 leaves the SIM off
          # ("+CME ERROR: SIM failure" until a power cycle). Full
          # functionality brings it back within a second.
          - delay: 1s
          - modem.send_at: "AT+CFUN=1"
  on_connect:
    - logger.log: "Cellular: PPP up"
    - script.stop: modem_watchdog
    - globals.set: { id: modem_syncs, value: "0" }
    - script.execute: network_beep
  on_disconnect:
    - logger.log: "Cellular: PPP down"
    - globals.set: { id: modem_syncs, value: "3" }   # restart the module at its next answer
    - script.execute: modem_watchdog

output:
  - platform: gpio
    id: modem_pwrkey
    pin: GPIO27
  # The buzzer, driven at 2 kHz like the stock firmware's beep()
  - platform: ledc
    id: buzzer
    pin: GPIO25
    frequency: 2000Hz

# The motion sensor (ICM-42627 on the Model B), on the same bus as in
# Freematics' library.
i2c:
  id: imu_bus
  sda: GPIO21
  scl: GPIO22
  scan: false
  frequency: 400kHz                  # 100 accelerometer samples a second come over it

icm426xx:
  id: motion_sensor
  i2c_id: imu_bus
  motion_threshold: ${motion_threshold}
  impact_threshold: ${impact_threshold}

binary_sensor:
  - platform: icm426xx
    motion:
      id: car_motion                 # on while the car is being moved, and 10 s after
      internal: true

script:
  # After a restart the SIM7070 sometimes reports its SIM as not inserted
  # ("+CPIN: NOT INSERTED") and never reads it again; the modem component
  # keeps asking without the module answering anew, so the restart on_sync
  # makes never comes (a whole drive went by like this). A module that has
  # answered but not connected for modem_restart_after is restarted, and
  # again each period after (nothing is sent while it isn't connected).
  - id: modem_watchdog
    mode: restart
    then:
      - delay: ${modem_restart_after}
      - if:
          condition:
            lambda: return id(cell).is_enabled() && !id(cell).is_connected();
          then:
            - logger.log:
                level: WARN
                format: "Cellular: no connection after ${modem_restart_after}; restarting the module (AT+CFUN=1,1)"
            - modem.send_at: "AT+CFUN=1,1"
            - script.execute: modem_watchdog
  # A short beep when Wi-Fi or cellular comes up, at most once in 10 minutes
  # (a network that keeps dropping the device would beep every minute).
  - id: network_beep
    then:
      - if:
          condition:
            lambda: |-
              return ${beep_on_network} &&
                     (id(last_network_beep) == 0 || millis() - id(last_network_beep) >= 600000);
          then:
            - lambda: id(last_network_beep) = millis() | 1;
            - script.execute: { id: beep, ms: 50 }
  # A beep of ms milliseconds; beeps asked for together play one after another.
  - id: beep
    mode: queued
    parameters:
      ms: int
    then:
      - output.set_level: { id: buzzer, level: 50% }
      - delay: !lambda return ms;
      - output.turn_off: buzzer
      - delay: 150ms
  # Press PWRKEY (200 ms, as the Freematics library does), let the module boot,
  # and only then let ESPHome's modem component talk to it: its recovery bytes
  # (a "+++" escape, CMUX close frames) reaching a module that is still booting
  # leave it silent until its power is cut (docs/plan.md, 2026-11-20). A
  # short press doesn't switch off a module that's already on. Every third try
  # first holds the key 2.5 s, which switches a stuck module off (as the
  # library's end() does), so the next press starts it afresh.
  # packages/wifi-first.yaml sets lte_blocked while Wi-Fi is up: then the
  # module isn't started, or the modem component isn't enabled.
  - id: modem_power_on
    mode: single
    then:
      - wait_until:
          condition:
            lambda: return id(lte_blocked);
          timeout: ${modem_wifi_wait}
      - if:
          condition:
            lambda: return id(lte_blocked);
          then:
            - logger.log: "Cellular: Wi-Fi is up; the module stays off"
      - repeat:
          count: ${modem_pwrkey_tries}
          then:
            - if:
                condition:
                  lambda: return !id(modem_synced) && !id(lte_blocked);
                then:
                  - if:
                      condition:
                        lambda: return iteration % 3 == 2;
                      then:
                        - logger.log: "Cellular: no answer; holding PWRKEY 2.5 s to switch the module off"
                        - modem.disable:
                        - output.turn_on: modem_pwrkey
                        - delay: 2500ms
                        - output.turn_off: modem_pwrkey
                        - delay: 5s
                  - logger.log: "Cellular: pressing PWRKEY"
                  - output.turn_on: modem_pwrkey
                  - delay: ${modem_pwrkey_press}
                  - output.turn_off: modem_pwrkey
                  - delay: ${modem_boot_wait}
                  - if:
                      condition:
                        lambda: return !id(lte_blocked);
                      then:
                        - modem.enable:
                  - delay: ${modem_pwrkey_wait}

globals:
  - id: modem_syncs              # module answers since the last connection
    type: uint8_t
    initial_value: "0"
  - id: modem_first_sync
    type: bool
    initial_value: "false"
  - id: modem_restart_now
    type: bool
    initial_value: "false"
  - id: last_network_beep        # millis() of the last network beep; 0: none yet
    type: uint32_t
    initial_value: "0"
  - id: lte_blocked              # set by packages/wifi-first.yaml while Wi-Fi is up
    type: bool
    initial_value: "false"
  - id: modem_restarted          # the module has been restarted since the ESP32 started
    type: bool
    initial_value: "false"
  - id: modem_synced
    type: bool
    initial_value: "false"

sensor:
  - platform: adc
    id: battery_voltage
    pin: GPIO36
    internal: true                   # uplink packages expose it where it's wanted
    attenuation: 12db
    update_interval: 30s
    accuracy_decimals: 2
    unit_of_measurement: V
    device_class: voltage
    filters:
      - multiply: 11.0   # 100k/10k divider; calibrate against a meter
  - platform: icm426xx
    temperature:
      id: dongle_temperature           # the motion sensor's chip, inside the dongle
      internal: true
    impact:
      id: impact_peak                  # each impact's peak, beyond gravity
      internal: true
  - platform: modem
    rssi:
      id: cell_signal                  # dBm while cellular is on (AT+CSQ: answered by the module, no data)
      internal: true

# Trips: decided once here, from the GNSS and the motion sensor, for every
# uplink. The battery voltage, temperature and signal ride along with trip
# starts, stops and heartbeats; an impact is reported at once.
trip_tracker:
  id: trips
  moving_speed: ${trip_moving_speed}
  start_fixes: ${trip_start_fixes}
  start_distance: ${trip_start_distance}
  start_motion: ${trip_start_motion}
  stop_delay: ${trip_stop_delay}
  motion: car_motion
  battery_voltage: battery_voltage
  temperature: dongle_temperature
  signal: cell_signal
  impact: impact_peak
  time_id: sntp_time

# ---------- Co-processor link (STM32F103: OBD and the internal GNSS) ----------
# freematics_link sends only ATI, ATRV, ATGPSON, ATGPS, ATGPSOFF and ATLP, all answered by the
# co-processor itself: nothing reaches the vehicle bus. The device config loads
# the component (external_components: components: [freematics_link, ...]).

uart:
  - id: coproc
    rx_pin: GPIO13
    tx_pin: GPIO14
    baud_rate: 115200
    rx_buffer_size: 512

freematics_link:
  id: coproc_link
  uart_id: coproc
  reset_pin:
    number: GPIO15
    ignore_strapping_warning: true
  gnss_interval: ${gnss_poll_interval}
  battery_interval: 0s               # the ADC reads battery voltage; ATRV is the alternative
  gnss_restart: ${gnss_restart}
  on_fix:
    - lambda: id(trips).add_fix(fix);
