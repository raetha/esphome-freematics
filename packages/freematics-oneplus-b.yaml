# Freematics ONE+ Model B board package for ESPHome 2026.11+
#
# What every dongle has, whatever it reports to: pins, the cellular modem and
# its power key, the co-processor link with the internal GNSS, battery voltage.
# Each GNSS fix lands in the gnss_* globals and runs the on_gnss_fix script,
# which an uplink package defines (packages/uplink-*.yaml). See the examples/
# configs, docs/hardware.md (pins and sources) and docs/configurations.md.
#
# Substitutions a device config must set: name, friendly_name, cell_apn.

substitutions:
  modem_model: SIM7070          # SIM7070G in the owner's dongles; SIM7600 also works
  modem_reboot_timeout: 0s      # reboot when LTE stays down this long; 0s: never (Wi-Fi-first turns LTE off at home)
  gnss_poll_interval: 2s        # reading the GNSS is local: costs no data
  coproc_log_level: INFO        # DEBUG logs every co-processor exchange

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: raetha.esphome-freematics
    version: "0.1.0"
  on_boot:
    - priority: 800
      then:
        # Keep the STM32 co-processor out of reset (GPIO15, active low).
        - output.turn_on: coproc_nreset
    - priority: -100
      then:
        - script.execute: modem_power_on
    - priority: -200
      then:
        - delay: 3s
        - uart.write: { id: coproc, data: "ATGPSON\r" }

esp32:
  board: esp32dev
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  level: DEBUG
  baud_rate: 115200
  logs:
    uart_debug: ${coproc_log_level}

time:
  - platform: sntp
    id: sntp_time

# ---------- Cellular (xBee socket) ----------
modem:
  id: cell
  model: ${modem_model}
  apn: ${cell_apn}
  rx_pin: GPIO35
  tx_pin:
    number: GPIO2
    ignore_strapping_warning: true   # Freematics wiring; only matters at boot
  baud_rate: 115200
  enable_on_boot: false               # powered on by modem_power_on
  reboot_timeout: ${modem_reboot_timeout}
  update_interval: 120s
  on_sync:
    - globals.set: { id: modem_synced, value: "true" }
  on_connect:
    - logger.log: "Cellular: PPP up"
  on_disconnect:
    - logger.log: "Cellular: PPP down"

output:
  - platform: gpio
    id: modem_pwrkey
    pin: GPIO27
  - platform: gpio
    id: coproc_nreset
    pin:
      number: GPIO15
      ignore_strapping_warning: true

script:
  # Press PWRKEY for 200 ms, as the Freematics library does, until the module
  # answers (a short press doesn't power off a module that's already on).
  # packages/wifi-first.yaml turns LTE off again if Wi-Fi is already up.
  - id: modem_power_on
    then:
      - modem.enable:
      - repeat:
          count: 5
          then:
            - if:
                condition:
                  lambda: return !id(modem_synced);
                then:
                  - logger.log: "Cellular: pressing PWRKEY"
                  - output.turn_on: modem_pwrkey
                  - delay: 200ms
                  - output.turn_off: modem_pwrkey
                  - delay: 10s

globals:
  - id: modem_synced
    type: bool
    initial_value: "false"
  # The latest GNSS fix, filled from ATGPS replies (see uart below)
  - id: gnss_valid
    type: bool
    initial_value: "false"
  - id: gnss_date        # ddmmyy, UTC
    type: uint32_t
    initial_value: "0"
  - id: gnss_time        # hhmmsscc, UTC
    type: uint32_t
    initial_value: "0"
  - id: gnss_lat
    type: float
    initial_value: "0"
  - id: gnss_lon
    type: float
    initial_value: "0"
  - id: gnss_kmh
    type: float
    initial_value: "0"
  - id: gnss_course
    type: float
    initial_value: "0"
  - id: gnss_sats
    type: uint8_t
    initial_value: "0"
  - id: gnss_hdop
    type: uint8_t
    initial_value: "0"

sensor:
  - platform: adc
    id: battery_voltage
    pin: GPIO36
    internal: true                   # uplink packages expose it where it's wanted
    attenuation: 12db
    update_interval: 30s
    accuracy_decimals: 2
    unit_of_measurement: V
    device_class: voltage
    filters:
      - multiply: 11.0   # 100k/10k divider; calibrate against a meter

# ---------- Co-processor link (STM32F103: OBD and the internal GNSS) ----------
# Only reads: ATGPS for the GNSS and, from buttons, ATI and ATRV, which the
# co-processor answers itself. Nothing here sends to the vehicle bus.
# Stopgap until the freematics_link component.
uart:
  - id: coproc
    rx_pin: GPIO13
    tx_pin: GPIO14
    baud_rate: 115200
    rx_buffer_size: 1024
    debug:
      direction: BOTH
      dummy_receiver: true
      after:
        delimiter: "\r"
      sequence:
        - lambda: |-
            UARTDebug::log_string(direction, bytes);
            if (direction != uart::UART_DIRECTION_RX) return;
            // Reply to ATGPS, per FreematicsPlus.cpp gpsGetData():
            // GNIFO,date,time,lat*1e6,lng*1e6,alt*100,speed(knots)*100,heading*100,sats,hdop
            std::string s(bytes.begin(), bytes.end());
            auto p = s.find("\x24GNIFO,");  // the dollar sign spelled out: ESPHome reads it as a substitution
            if (p == std::string::npos) return;
            long v[9] = {0};
            int n = 0;
            const char *c = s.c_str() + p + 7;
            while (n < 9 && *c) {
              v[n++] = atol(c);
              const char *q = strchr(c, ',');
              if (q == nullptr) break;
              c = q + 1;
            }
            if (n < 4 || (v[2] == 0 && v[3] == 0)) {
              id(gnss_valid) = false;
              return;
            }
            id(gnss_valid) = true;
            id(gnss_date) = v[0];
            id(gnss_time) = v[1];
            id(gnss_lat) = v[2] / 1e6f;
            id(gnss_lon) = v[3] / 1e6f;
            id(gnss_kmh) = n > 5 ? v[5] / 100.0f * 1.852f : 0;
            id(gnss_course) = n > 6 ? v[6] / 100.0f : 0;
            id(gnss_sats) = n > 7 ? v[7] : 0;
            id(gnss_hdop) = n > 8 ? v[8] : 0;
            id(on_gnss_fix).execute();

interval:
  - interval: ${gnss_poll_interval}
    then:
      - uart.write: { id: coproc, data: "ATGPS\r" }
