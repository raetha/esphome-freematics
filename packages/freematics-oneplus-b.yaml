# Freematics ONE+ Model B board package for ESPHome 2026.11+
#
# Pulls in everything that is the same on every dongle: pins, the cellular
# modem, the co-processor link (internal GNSS, later OBD), diagnostics, and the
# native API set up to dial Home Assistant itself. A device config adds what is
# its own: name, APN, Wi-Fi networks, API key, WireGuard keys.
# See examples/car.yaml, docs/hardware.md (pins and sources) and
# docs/networking.md (data use: every entity here costs cellular data).
#
# Substitutions a device config must set: name, friendly_name, cell_apn.

substitutions:
  modem_model: SIM7070     # SIM7070G in the owner's dongles; SIM7600 also works
  api_batch_delay: 2s      # state updates within this window share one packet
  gnss_poll_interval: 5s

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: raetha.esphome-freematics
    version: "0.1.0"
  on_boot:
    - priority: 800
      then:
        # Keep the STM32 co-processor out of reset (GPIO15, active low).
        - output.turn_on: coproc_nreset
    - priority: -100
      then:
        - script.execute: modem_power_on
    - priority: -200
      then:
        - delay: 3s
        - uart.write: { id: coproc, data: "ATGPSON\r" }

esp32:
  board: esp32dev
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  level: DEBUG
  baud_rate: 115200

# ---------- Home Assistant: native API, dialled from the device ----------
# outgoing_connection: the device connects to Home Assistant itself (HA 2026.10+,
# encryption required), so HA never has to reach the dongle behind the carrier's
# NAT. Add the device to HA once while it's on home Wi-Fi; it remembers HA's
# address and dials it, over WireGuard, from LTE. The device config sets the key.
api:
  batch_delay: ${api_batch_delay}
  reboot_timeout: 0s       # never reboot just because HA isn't connected
  outgoing_connection:
    delay: 60s

# ---------- Cellular (xBee socket) ----------
modem:
  id: cell
  model: ${modem_model}
  apn: ${cell_apn}
  rx_pin: GPIO35
  tx_pin:
    number: GPIO2
    ignore_strapping_warning: true   # Freematics wiring; only matters at boot
  baud_rate: 115200
  enable_on_boot: false               # powered on by modem_power_on
  reboot_timeout: 15min
  update_interval: 120s
  on_sync:
    - globals.set: { id: modem_synced, value: "true" }
  on_connect:
    - logger.log: "Cellular: PPP up"
  on_disconnect:
    - logger.log: "Cellular: PPP down"

globals:
  - id: modem_synced
    type: bool
    initial_value: "false"

script:
  # Press PWRKEY for 200 ms, as the Freematics library does, and let ESPHome
  # bring up PPP. The library repeats the press until the module answers, so
  # this does too (a short press doesn't power off a module that's already on).
  - id: modem_power_on
    then:
      - modem.enable:
      - repeat:
          count: 5
          then:
            - if:
                condition:
                  lambda: return !id(modem_synced);
                then:
                  - logger.log: "Cellular: pressing PWRKEY"
                  - output.turn_on: modem_pwrkey
                  - delay: 200ms
                  - output.turn_off: modem_pwrkey
                  - delay: 10s

output:
  - platform: gpio
    id: modem_pwrkey
    pin: GPIO27
  - platform: gpio
    id: coproc_nreset
    pin:
      number: GPIO15
      ignore_strapping_warning: true

time:
  - platform: sntp
    id: sntp_time

# ---------- Diagnostics ----------
# Each sends only on a real change, and at most every 15 minutes otherwise.
debug:
  update_interval: 300s

sensor:
  - platform: modem
    rssi:
      name: Cellular RSSI
      filters:
        - or:
            - throttle: 15min
            - delta: 4
    ber:
      name: Cellular bit error rate
      filters:
        - or:
            - throttle: 15min
            - delta: 2
  - platform: uptime
    name: Uptime
    update_interval: 15min
  - platform: debug
    free:
      name: Free heap
      filters:
        - or:
            - throttle: 15min
            - delta: 8000
    block:
      name: Largest free block
      filters:
        - or:
            - throttle: 15min
            - delta: 8000
    loop_time:
      name: Loop time
      filters:
        - or:
            - throttle: 15min
            - delta: 20
  - platform: adc
    pin: GPIO36
    name: Battery voltage (ADC)
    attenuation: 12db
    update_interval: 30s
    accuracy_decimals: 2
    unit_of_measurement: V
    device_class: voltage
    filters:
      - multiply: 11.0   # 100k/10k divider; calibrate against a meter
      - or:
          - throttle: 15min
          - delta: 0.2
  # Internal GNSS, read through the co-processor (filled by the uart lambda below).
  # Position goes out only when it moves about 10 m or more.
  - platform: template
    id: gnss_lat
    name: GNSS latitude
    accuracy_decimals: 6
    filters:
      - delta: 0.0001
  - platform: template
    id: gnss_lon
    name: GNSS longitude
    accuracy_decimals: 6
    filters:
      - delta: 0.0001
  - platform: template
    id: gnss_speed
    name: GNSS speed
    unit_of_measurement: km/h
    accuracy_decimals: 0
    filters:
      - delta: 5
  - platform: template
    id: gnss_sats
    name: GNSS satellites
    filters:
      - delta: 2
  - platform: template
    id: gnss_hdop
    name: GNSS HDOP (raw)
    filters:
      - delta: 5

text_sensor:
  - platform: debug
    reset_reason:
      name: Reset reason

binary_sensor:
  - platform: template
    id: gnss_fix
    name: GNSS fix
  - platform: template
    name: Cellular connected
    device_class: connectivity
    lambda: return id(cell).is_connected();

# ---------- Co-processor link (STM32F103: OBD and the internal GNSS) ----------
# Stopgap until the freematics_link component: replies are logged, and ATGPS
# replies are parsed into the GNSS entities.
uart:
  - id: coproc
    rx_pin: GPIO13
    tx_pin: GPIO14
    baud_rate: 115200
    rx_buffer_size: 1024
    debug:
      direction: BOTH
      dummy_receiver: true
      after:
        delimiter: "\r"
      sequence:
        - lambda: |-
            UARTDebug::log_string(direction, bytes);
            if (direction != uart::UART_DIRECTION_RX) return;
            // Reply to ATGPS, per FreematicsPlus.cpp gpsGetData():
            // $GNIFO,date,time,lat*1e6,lng*1e6,alt*100,speed(knots)*100,heading*100,sats,hdop
            std::string s(bytes.begin(), bytes.end());
            auto p = s.find("$GNIFO,");
            if (p == std::string::npos) return;
            long v[9] = {0};
            int n = 0;
            const char *c = s.c_str() + p + 7;
            while (n < 9 && *c) {
              v[n++] = atol(c);
              const char *q = strchr(c, ',');
              if (q == nullptr) break;
              c = q + 1;
            }
            if (n < 4 || (v[2] == 0 && v[3] == 0)) {
              id(gnss_fix).publish_state(false);
              return;
            }
            id(gnss_fix).publish_state(true);
            id(gnss_lat).publish_state(v[2] / 1e6f);
            id(gnss_lon).publish_state(v[3] / 1e6f);
            if (n > 5) id(gnss_speed).publish_state(v[5] / 100.0f * 1.852f);
            if (n > 7) id(gnss_sats).publish_state(v[7]);
            if (n > 8) id(gnss_hdop).publish_state(v[8]);

interval:
  - interval: ${gnss_poll_interval}
    then:
      - if:
          condition:
            switch.is_on: gnss_polling
          then:
            - uart.write: { id: coproc, data: "ATGPS\r" }

switch:
  - platform: template
    id: gnss_polling
    name: GNSS polling
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

button:
  - platform: restart
    name: Restart
  # Answers appear in the device log (ESPHome's log viewer, or USB serial)
  - platform: template
    name: "Modem: serving cell (AT+CPSI?)"
    entity_category: diagnostic
    on_press:
      - modem.send_at: "AT+CPSI?"
  - platform: template
    name: "Modem: module info (ATI)"
    entity_category: diagnostic
    on_press:
      - modem.send_at: "ATI"
  - platform: template
    name: "Co-proc: identify (ATI)"
    entity_category: diagnostic
    on_press:
      - uart.write: { id: coproc, data: "ATI\r" }
  - platform: template
    name: "Co-proc: battery (ATRV)"
    entity_category: diagnostic
    on_press:
      - uart.write: { id: coproc, data: "ATRV\r" }
  - platform: template
    name: "Co-proc: raw NMEA (ATGRR)"
    entity_category: diagnostic
    on_press:
      - uart.write: { id: coproc, data: "ATGRR\r" }
