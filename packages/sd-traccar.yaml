# Every record stays on the SD card until Traccar acknowledges it, so a restart
# or a long time without coverage loses nothing; memory holds the next 300 to
# send. Without a card the uplink keeps 300 in memory, as without this package.
#
# Needs sd-card.yaml and uplink-traccar.yaml; the device config loads the
# components (external_components: components: [file_queue, ...]).

substitutions:
  traccar_stored_records: "50000"     # 28 bytes each: 50,000 is 1.4 MB, about 140 hours of driving
  traccar_store_writer_task: "true"   # write to the card from a task of its own; "false": from the main loop (tens of ms per record)

file_queue:
  id: traccar_store
  path: /sdcard/traccar.bin
  capacity: ${traccar_stored_records}
  writer_task: ${traccar_store_writer_task}

traccar_uplink:
  file_queue_id: traccar_store
