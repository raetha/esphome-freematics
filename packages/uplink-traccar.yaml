# Report to Traccar: GNSS fixes as compact Teltonika GH3000 records over UDP,
# batched, acknowledged by Traccar, and kept in memory until they are.
# Nothing here talks to Home Assistant. See docs/configurations.md.
#
# Needs the board package, and the traccar_uplink component from this
# repository's components/ (external_components: in the device config).
#
# Substitutions a device config must set: traccar_host, traccar_device_id
# (the Traccar device's identifier; a device that used the Freematics protocol
# can keep its identifier).

substitutions:
  traccar_port: "5027"                # Traccar's Teltonika port (UDP)
  traccar_send_interval: 60s          # batch fixes this long before sending (sooner on a stop or a full batch)
  traccar_moving_speed: "6"           # km/h: at or above, the car is moving
  traccar_moving_interval: 10s        # a fix at least this often while moving
  traccar_turn_angle: "30"            # degrees: a turn this sharp records a fix early
  traccar_stop_delay: 180s            # below moving speed this long: the trip is over (telelogger: 180 s)
  traccar_heartbeat_interval: 15min   # one record this often while parked; 0s: none (telelogger: 15 min)
  traccar_stored_records: "50000"     # records kept on the SD card until Traccar has them (about 28 bytes each)

# Every record stays on the SD card until Traccar acknowledges it, so a reboot or
# a long time without coverage loses nothing. Without a card, memory holds 300.
file_queue:
  id: traccar_store
  path: /sdcard/traccar.bin
  capacity: ${traccar_stored_records}

traccar_uplink:
  id: traccar
  file_queue_id: traccar_store
  host: ${traccar_host}
  port: ${traccar_port}
  device_id: ${traccar_device_id}
  send_interval: ${traccar_send_interval}
  moving_speed: ${traccar_moving_speed}
  moving_interval: ${traccar_moving_interval}
  turn_angle: ${traccar_turn_angle}
  stop_delay: ${traccar_stop_delay}
  heartbeat_interval: ${traccar_heartbeat_interval}
  battery_voltage: battery_voltage    # sent with trip starts, stops and heartbeats
  time_id: sntp_time
  # Hooks for later: OBD values read once per stop, not while driving.
  on_motion_stop:
    - logger.log: "Parked"

script:
  - id: on_gnss_fix
    then:
      - lambda: |-
          id(traccar).add_fix(id(gnss_date), id(gnss_time), id(gnss_lat), id(gnss_lon),
                              id(gnss_kmh), id(gnss_course), id(gnss_sats));
