# Testing: let the GNSS find its first fix before the radios start. At start or
# on a wake (but not a heartbeat wake), Wi-Fi and LTE wait until the GNSS has a
# fix, or gnss_first_wait at most. Nothing is lost while they wait: records
# queue and go out once a network is up.
#
# The question it answers: does the cellular module, searching and attaching a
# couple of centimetres from the GNSS antenna, slow the first fix? Add it to one
# dongle and not the other, and compare the log's "GNSS fix: ... (the first,
# N s after start)" lines over a few drives.
#
# Needs the board package, packages/wifi-first.yaml and packages/standby.yaml.

substitutions:
  gnss_first_wait: 3min   # the most the radios wait for the first fix

esphome:
  on_boot:
    # After standby's wake check (599.5), which says whether this is a
    # heartbeat wake; before the modem's power-on (-100).
    - priority: 500
      then:
        - lambda: |-
            if (!id(heartbeat_wake))
              id(radios_held) = true;
    # After Wi-Fi's setup, which has started it
    - priority: -100
      then:
        - if:
            condition:
              lambda: return id(radios_held);
            then:
              - logger.log: { format: "GNSS first: Wi-Fi and LTE wait for the first fix (at most ${gnss_first_wait})", level: INFO }
              - wifi.disable:
              - wait_until:
                  condition:
                    lambda: return id(trips).last_fix_ms() != 0;
                  timeout: ${gnss_first_wait}
              - lambda: |-
                  if (id(trips).last_fix_ms() != 0) {
                    ESP_LOGI("gnss_first", "GNSS fix: Wi-Fi and LTE start");
                  } else {
                    ESP_LOGI("gnss_first", "No GNSS fix yet: Wi-Fi and LTE start anyway");
                  }
                  id(radios_held) = false;
