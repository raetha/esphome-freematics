# Wi-Fi first: while a known Wi-Fi network is connected, LTE is switched off;
# when Wi-Fi drops, LTE comes back. Like the telelogger, which joins Wi-Fi when
# it finds it and shuts the cellular connection down.
#
# While the car is moving and Wi-Fi isn't connected, the Wi-Fi search pauses:
# scanning every few seconds on the road finds nothing and is radio noise beside
# the GNSS antenna. A connection made before moving (a phone hotspot) is kept.
# The search resumes once the car has been still a while, or GNSS has had no fix
# for a while (a garage), so home Wi-Fi is found soon after parking.
#
# A car that has stopped where no known network answers won't find one until it
# moves again, so after wifi_search_time without finding one the search stops
# until the car has moved (at wifi_pause_speed or more). It starts again with
# each start or wake of the dongle. A network that was connected here and
# dropped (an access point restarting, a power cut) is different: the search
# goes on, in windows of wifi_search_time spaced 1, 2, 4, 8 and then every
# 15 minutes, until it's back or the car moves.
#
# Needs the board package and a wifi: block with networks in the device config.

substitutions:
  lte_back_after: 30s     # Wi-Fi gone this long: turn LTE back on
  wifi_pause_speed: "10"  # km/h: at or above, with no Wi-Fi connected, stop searching for Wi-Fi; "1000": never pause
  wifi_resume_after: "30" # seconds below that speed (or without a GNSS fix) before searching again
  wifi_search_time: "120" # seconds: parked, stop searching after this long without a known network, until the car moves; "0": search on
  wifi_power_save: light  # Wi-Fi power saving: light, or none if an access point keeps dropping the device
  lte_on_wifi: "false"    # "true" for bench tests: LTE stays on beside Wi-Fi, so its logs reach Device Builder

wifi:
  reboot_timeout: 0s      # never reboot because the car is away from home
  power_save_mode: ${wifi_power_save}
  on_connect:
    - script.execute: network_beep
    - lambda: |-
        id(wifi_dropped) = false;
        id(wifi_retry_s) = 60;
    - if:
        condition:
          lambda: return !${lte_on_wifi};
        then:
          - logger.log: "Wi-Fi up: turning LTE off"
          - globals.set: { id: lte_blocked, value: "true" }
          - if:
              condition:
                not:
                  script.is_running: modem_power_on
              then:
                - modem.disable:
  on_disconnect:
    - lambda: |-
        // A known network was just here: keep searching for it (with pauses).
        id(wifi_search_ms) = millis();
        id(wifi_dropped) = true;
    - delay: ${lte_back_after}
    - if:
        condition:
          not:
            wifi.connected:
        then:
          - logger.log: "Wi-Fi gone: turning LTE on"
          - globals.set: { id: lte_blocked, value: "false" }
          - if:
              condition:
                lambda: return id(modem_synced);
              then:
                - modem.enable:
              else:
                # The module was never started (Wi-Fi was up from the start)
                - if:
                    condition:
                      not:
                        script.is_running: modem_power_on
                    then:
                      - script.execute: modem_power_on

globals:
  - id: wifi_moving_ms             # millis() when the car was last seen moving; 0: not yet
    type: uint32_t
    initial_value: "0"
  - id: wifi_search_ms             # millis() when the current search began (0: at start)
    type: uint32_t
    initial_value: "0"
  - id: wifi_gave_up               # no known network where the car stopped: search again once it has moved
    type: bool
    initial_value: "false"
  - id: wifi_dropped               # a network was connected where the car is now: keep looking for it
    type: bool
    initial_value: "false"
  - id: wifi_retry_s               # the next pause between searches for a dropped network
    type: uint32_t
    initial_value: "60"
  - id: wifi_retry_ms              # millis() when the next search for it may start; 0: any time
    type: uint32_t
    initial_value: "0"

interval:
  - interval: 5s
    then:
      - lambda: |-
          uint32_t now = millis();
          uint32_t fix_ms = id(trips).last_fix_ms();
          bool fresh = fix_ms != 0 && now - fix_ms < 30000;
          if (fresh && id(trips).last_fix().speed_kmh >= ${wifi_pause_speed}) {
            id(wifi_moving_ms) = now;
            id(wifi_gave_up) = false;  // a new place: search there afresh
            id(wifi_dropped) = false;
            id(wifi_retry_s) = 60;
            id(wifi_retry_ms) = 0;
          }
      - if:
          condition:
            and:
              - wifi.enabled:
              - not:
                  wifi.connected:
              - lambda: return id(wifi_moving_ms) != 0 && millis() - id(wifi_moving_ms) < 1000;
          then:
            - logger.log: "Moving: Wi-Fi search paused until the car stops"
            - wifi.disable:
      - if:
          condition:
            and:
              - wifi.enabled:
              - not:
                  wifi.connected:
              - lambda: |-
                  return ${wifi_search_time} > 0 &&
                         millis() - id(wifi_search_ms) >= ${wifi_search_time} * 1000UL;
          then:
            - lambda: |-
                if (id(wifi_dropped)) {
                  ESP_LOGI("wifi_first", "Wi-Fi still gone: searching again in %u s", (unsigned) id(wifi_retry_s));
                  id(wifi_retry_ms) = (millis() + id(wifi_retry_s) * 1000) | 1;
                  id(wifi_retry_s) = std::min<uint32_t>(id(wifi_retry_s) * 2, 900);
                } else {
                  ESP_LOGI("wifi_first", "No known Wi-Fi here after %d s: searching again once the car has moved",
                           ${wifi_search_time});
                  id(wifi_gave_up) = true;
                }
            - wifi.disable:
      - if:
          condition:
            and:
              - not:
                  wifi.enabled:
              - lambda: |-
                  uint32_t now = millis();
                  return !id(wifi_gave_up) &&
                         now - id(wifi_moving_ms) >= ${wifi_resume_after} * 1000UL &&
                         (id(wifi_retry_ms) == 0 || static_cast<int32_t>(now - id(wifi_retry_ms)) >= 0);
          then:
            - logger.log: "Still: searching for Wi-Fi again"
            - lambda: |-
                id(wifi_search_ms) = millis();
                id(wifi_retry_ms) = 0;
            - wifi.enable:

esphome:
  on_boot:
    # The board package's power-on leaves LTE on; once it's done, turn LTE off
    # again if Wi-Fi is already up.
    - priority: -300
      then:
        - wait_until:
            condition:
              not:
                script.is_running: modem_power_on
        - if:
            condition:
              and:
                - wifi.connected:
                - lambda: return !${lte_on_wifi};
            then:
              - modem.disable:
